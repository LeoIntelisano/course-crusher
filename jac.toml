[project]
name = "course-crusher"
version = "0.1.0"
description = "Breaks assignments into subtasks and fits them into a student's free time"
jac-version = "==0.37.23"
default-app = "web"

# `jac run` serves the web app; `jac run cli -- free-slots ...` runs the CLI.
[apps.web]
kind = "web-app"
entry-point = "web"

[apps.cli]
kind = "cli"
entry-point = "main"

# Markerless pure modules would otherwise compile native; nothing here needs it.
[placement]
default = "server"

[dependencies]
google-auth = "~=2.60"
google-auth-oauthlib = "~=1.5"
requests = "~=2.34"
# Zone data for slim images with no system tz database
tzdata = ">=2024.1"

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"
tailwindcss = "4.3.3"
"@tailwindcss/vite" = "4.3.3"

[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "CourseCrusher"
description = "Breaks assignments into subtasks and fits them into your free time"

# Bootstrap admin for /admin (logs, LLM telemetry). Set the password before any shared deploy.
[scale.admin]
default_password = "${JAC_ADMIN_PASSWORD:-changeme}"

[dev-dependencies]
watchdog = ">=3.0.0"
